    if (saved && saved.answers && Number.isInteger(saved.step)) return { step: Math.max(0, Math.min(saved.step, 18)), answers: saved.answers };
  } catch (_) { /* use a fresh, local-only profile */ }

}

    const rangeMax = Math.min(step.max, Math.ceil(current * 1.35));
    const start = value !== "" ? Math.max(rangeMin, Math.min(rangeMax, Number(value))) : Math.max(rangeMin, Math.min(rangeMax, current));
    return `<div class="goal-control"><label class="field-label" for="goal-slider">Ou explore uma meta no controle deslizante</label><div class="range-heading"><span>Meta sugerida por você</span><output id="goal-range-output">${value !== "" ? `${formatKg(value)} kg` : "Meta não definida"}</output></div><input id="goal-slider" type="range" min="${rangeMin}" max="${rangeMax}" step="0.5" value="${start}" aria-label="Controle opcional da meta de peso" /><p class="field-note">O controle acompanha uma faixa próxima ao peso atual; o campo acima aceita qualquer valor permitido.</p><div id="goal-live-chart">${renderWeightChart()}</div></div>`;
  })() : "";
  return `<label class="field-label" for="answer-input">${escapeHtml(step.label)}</label><div class="input-wrap">${field}${step.suffix ? `<span>${escapeHtml(step.suffix)}</span>` : ""}</div>${step.optional ? `<p class="field-note">Este campo é opcional.</p>` : ""}${goalTools}`;
}
function stepBody(step) {
  if (step.type === "choice" || step.type === "multi") return optionCards(step);
  if (step.type === "exercise") return `<figure class="quiz-illustration"><img src="${escapeHtml(step.illustration)}" alt="${escapeHtml(step.illustrationAlt)}" loading="lazy" /></figure>${optionCards(step)}`;
  if (step.type === "number" || step.type === "text") return inputControl(step);
  if (step.type === "bmi") return `<div class="metric-card"><span class="metric-label">Seu IMC indicativo</span><strong>${bmiValue()}</strong><span class="metric-caption">Uma medida geral que não avalia a sua saúde individual.</span></div><div class="soft-note"><span class="note-mark" aria-hidden="true">i</span><p>Seu peso e sua altura não definem seu valor nem substituem uma avaliação profissional. Vamos seguir pensando em hábitos que façam sentido para você.</p></div>`;
  if (step.type === "summary") {
    const name = firstName();
    const goal = escapeHtml(state.answers.goal || "uma rotina consistente");
    const days = escapeHtml(state.answers.days || "no seu ritmo");
    const focus = Array.isArray(state.answers.focus) ? state.answers.focus.join(", ") : "corpo todo";
    return `<div class="summary-panel"><div class="summary-symbol" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M24 5a19 19 0 1 0 19 19h-7a12 12 0 1 1-3.52-8.48L26.7 21.3H43V5l-4.9 4.9A18.94 18.94 0 0 0 24 5Z" fill="currentColor"/></svg></div><p class="summary-welcome">${name ? `${escapeHtml(name)}, ` : ""}seu próximo passo pode ser simples.</p><p class="summary-copy">Você quer <strong>${goal.toLowerCase()}</strong>, com espaço para ${escapeHtml(focus.toLowerCase())} e uma frequência de <strong id="summary-frequency">${days}</strong>. Use isso como ponto de partida e ajuste conforme se sentir.</p><div class="summary-tags"><span id="summary-days-tag">${days}</span><span>${escapeHtml(state.answers.place || "Onde for possível")}</span></div><div class="profile-charts">${renderWeightChart()}${renderWeekChart()}</div><p class="disclaimer">As respostas ficam apenas neste navegador nesta demonstração. Os gráficos refletem metas e dias escolhidos por você; não preveem resultados, e este resumo não é recomendação médica ou nutricional.</p></div>`;
  }
  return "";
}
function isValid(step) {
  const value = state.answers[step.key];
  if (step.type === "choice" || step.type === "exercise") return Boolean(value);
  if (step.type === "multi") return Array.isArray(value) && value.length > 0;
  if (step.type === "text") return String(value || "").trim().length >= (step.minLength || 1);
  if (step.type === "number") {
    if (step.optional && (value === "" || value == null)) return true;
    const number = Number(value);
    return Number.isFinite(number) && number >= step.min && number <= step.max;
  }
  return true;
}
function renderQuiz() {
  state.step = Math.max(0, Math.min(state.step, steps.length - 1));
  const step = steps[state.step];
  const progress = state.step === steps.length - 1 ? 100 : Math.round(state.step / (steps.length - 1) * 100);
  const isLast = step.type === "summary";
  const actionLabel = isLast ? "Ver minha sugestão de planos" : "Continuar";
  const index = String(state.step + 1).padStart(2, "0");
  const total = String(steps.length).padStart(2, "0");
  app.innerHTML = `${stepHeader(progress, state.step > 0)}
    <main class="quiz-main">
      <div class="step-meta"><span>SEU PLANO, NO SEU RITMO</span><span>${index} / ${total}</span></div>
      <section class="question-card" aria-labelledby="question-title">
        <p class="eyebrow">${state.step === 0 ? "VAMOS COMEÇAR" : `ETAPA ${index}`}</p>
        <h1 id="question-title">${escapeHtml(step.title)}</h1>
        ${step.helper ? `<p class="question-helper">${escapeHtml(step.helper)}</p>` : ""}
        <div class="step-content">${stepBody(step)}</div>
        <p id="form-error" class="form-error" aria-live="polite"></p>
        <div class="step-actions">
          ${step.optional ? `<button id="skip-button" class="text-button" type="button">Ainda não sei</button>` : ""}
          <button id="continue-button" class="primary-button" type="button" ${isValid(step) ? "" : "disabled"}>${actionLabel}<span aria-hidden="true">→</span></button>
        </div>
      </section>
      <p class="privacy-line"><span aria-hidden="true">◆</span> Suas respostas ficam salvas apenas neste navegador.</p>
    </main>
    <footer class="quiz-footer">Leanfit · movimento possível, todos os dias</footer>`;
  wireQuiz(step);
}
function wireQuiz(step) {
  document.querySelectorAll(".quiz-header [data-home]").forEach((link) => link.addEventListener("click", (event) => { event.preventDefault(); returnToQuiz(); }));
  const back = document.getElementById("back-button");
  if (back) back.addEventListener("click", () => { if (state.step > 0) { state.step--; persist(); renderQuiz(); } });
  document.querySelectorAll("[data-choice]").forEach((button) => button.addEventListener("click", () => {
    const value = button.dataset.choice;
    if (step.type === "multi") {
      const selected = Array.isArray(state.answers[step.key]) ? [...state.answers[step.key]] : [];
      const at = selected.indexOf(value);
      if (at >= 0) selected.splice(at, 1); else selected.push(value);
      state.answers[step.key] = selected;
    } else {
      state.answers[step.key] = value;
    }
    persist(); renderQuiz();
  }));
  const input = document.getElementById("answer-input");
  if (input) {
    input.addEventListener("input", () => {
      state.answers[step.key] = input.value;
      persist();
      const button = document.getElementById("continue-button");
      if (button) button.disabled = !isValid(step);
      const error = document.getElementById("form-error");
      if (error) error.textContent = "";
      if (step.key === "targetWeight") {
        const slider = document.getElementById("goal-slider");
        if (slider && input.value !== "") slider.value = String(Math.max(Number(slider.min), Math.min(Number(slider.max), Number(input.value))));
        updateGoalPreview();
      }
    });
    input.addEventListener("keydown", (event) => { if (event.key === "Enter" && isValid(step)) document.getElementById("continue-button").click(); });
  }
  const goalSlider = document.getElementById("goal-slider");
  if (goalSlider) goalSlider.addEventListener("input", () => {
    const targetInput = document.getElementById("answer-input");
    targetInput.value = goalSlider.value;
    state.answers.targetWeight = goalSlider.value;
    persist();
    const button = document.getElementById("continue-button");
    if (button) button.disabled = !isValid(step);
    updateGoalPreview();
  });
  if (step.type === "summary") wireWeekdayControls();
  const advance = (skip = false) => {
    if (input && !skip) state.answers[step.key] = input.value.trim();
    if (!skip && !isValid(step)) {
      const error = document.getElementById("form-error");
      if (error) error.textContent = step.type === "number" ? `Informe um valor entre ${step.min} e ${step.max}${step.suffix ? ` ${step.suffix}` : ""}.` : "Escolha uma opção para continuar.";
      input?.focus();
      return;
    }
    if (skip && step.key === "targetWeight") delete state.answers.targetWeight;
    if (state.step < steps.length - 1) {
      state.step++;
      persist();
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    persist();
    history.pushState({ page: "offer" }, "", window.location.pathname + "#oferta");
    trackPageView();
    renderSales();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  document.getElementById("continue-button")?.addEventListener("click", () => advance(false));
  document.getElementById("skip-button")?.addEventListener("click", () => advance(true));
}
